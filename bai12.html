<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 12 - In lịch</title>
    <link rel="stylesheet" href="bai12.css">
</head>
<body>

    <div class="main-container">
        <div class="calendar-card">
            <div class="calendar-year" id="displayYear">2026</div>
            <div class="calendar-month" id="displayMonth">Tháng 12</div>
            <div class="calendar-day" id="displayDay">24</div>
            <div class="calendar-weekday" id="displayWeekday">Thứ hai</div>
        </div>
        <div class="greeting-text" id="displayGreeting">
            Chào buổi sáng!
        </div>
        <div class="input-form-box">
            <div class="input-group">
                <label for="inputDay">Ngày</label>
                <input type="number" id="inputDay" value="24" min="1" max="31">
            </div>

            <div class="input-group">
                <label for="inputMonth">Tháng</label>
                <input type="number" id="inputMonth" value="12" min="1" max="12">
            </div>

            <div class="input-group">
                <label for="inputYear">Năm</label>
                <input type="number" id="inputYear" value="2026">
            </div>

            <button id="btnPrint" class="btn-print">In<br>lịch</button>
        </div>
    </div>
    <script src="bai12.js"></script>
</body>
</html>
