<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 23 - Thư viện ảnh Hiệu ứng Hover</title>
    <link rel="stylesheet" href="bai23.css">
</head>
<body>

    <div class="gallery-container">
        <header class="gallery-header">
            <h1>Thư viện ảnh — Hiệu ứng Hover</h1>
            <p>Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
        </header>

        <main class="gallery-grid">
            <div class="gallery-item">
                <img src="ha-long.jpg" alt="Vịnh Hạ Long">
                <div class="gallery-overlay">
                    <span class="gallery-title">Vịnh Hạ Long</span>
                </div>
            </div>

            <div class="gallery-item">
                <img src="son-doong.jpg" alt="Hang Sơn Đoòng">
                <div class="gallery-overlay">
                    <span class="gallery-title">Hang Sơn Đoòng</span>
                </div>
            </div>

            <div class="gallery-item">
                <img src="ban-gioc.jpg" alt="Thác Bản Giốc">
                <div class="gallery-overlay">
                    <span class="gallery-title">Thác Bản Giốc</span>
                </div>
            </div>

            <div class="gallery-item">
                <img src="fansipan.jpg" alt="Fansipan">
                <div class="gallery-overlay">
                    <span class="gallery-title">Fansipan</span>
                </div>
            </div>

            <div class="gallery-item">
                <img src="cuu-long.jpg" alt="Đồng bằng sông Cửu Long">
                <div class="gallery-overlay">
                    <span class="gallery-title">Đồng bằng sông Cửu Long</span>
                </div>
            </div>

            <div class="gallery-item">
                <img src="phong-nha.jpg" alt="Động Phong Nha">
                <div class="gallery-overlay">
                    <span class="gallery-title">Động Phong Nha</span>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
