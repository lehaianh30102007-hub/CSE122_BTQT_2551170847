
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Các món ngon Hà Nội</title>
    <link rel="stylesheet" href="bai6.css">
</head>
<body>

            <table>
                <thead>
                    <tr>
                        <th class="col-stt">STT</th>

                    <tr>
                        <td class="col-stt">5</td>
                        <td>Bánh Gai Ninh Giang</td>
                    </tr>
                    <tr class="even-row">
                        <td class="col-stt">6</td>
                        <td>Bún Thang Hà Nội</td>
                    </tr>
                    <tr>
                        <td class="col-stt">7</td>

                    </tr>
                    <tr class="even-row">

                </tbody>
            </table>

</html>
