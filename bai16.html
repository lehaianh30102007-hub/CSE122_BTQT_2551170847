<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 16 - Danh sách việc cần làm</title>
    <link rel="stylesheet" href="bai16.css">
</head>
<body>
    <div class="todo-app">
        <header class="app-header">
            <h1>Danh sách việc cần làm</h1>
            <p>Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.</p>
        </header>
        <div class="input-section">
            <input type="text" id="todoInput" placeholder="Hoàn thành bài tập Lập trình Web">
            <button id="addBtn" class="btn-add">Thêm</button>
        </div>
        <ul id="todoList" class="todo-list">
            <li class="todo-item completed">
                <span class="custom-checkbox" onclick="toggleTask(this)"></span>
                <span class="task-text" onclick="toggleTask(this)">Đọc chương HTML5 cơ bản</span>
                <button class="btn-delete" onclick="deleteTask(this)">Xoá</button>
            </li>
            <li class="todo-item">
                <span class="custom-checkbox" onclick="toggleTask(this)"></span>
                <span class="task-text" onclick="toggleTask(this)">Làm bài tập CSS Grid</span>
                <button class="btn-delete" onclick="deleteTask(this)">Xoá</button>
            </li>
            <li class="todo-item">
                <span class="custom-checkbox" onclick="toggleTask(this)"></span>
                <span class="task-text" onclick="toggleTask(this)">Quay video OBS nộp bài</span>
                <button class="btn-delete" onclick="deleteTask(this)">Xoá</button>
            </li>
        </ul>
        <footer class="app-footer">
            <p id="remainingCount">Còn 2 việc chưa hoàn thành</p>
        </footer>
    </div>
    <script src="bai16.js"></script>
</body>
</html>
